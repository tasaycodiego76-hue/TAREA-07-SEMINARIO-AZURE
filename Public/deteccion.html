<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detección de Objetos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5" style="max-width: 650px;">

        <a href="/" class="text-decoration-none text-muted">← Volver</a>

        <h2 class="mt-3 mb-1">Detección de objetos</h2>
        <p class="text-muted mb-4">Ingresa la URL de una imagen y detecta los objetos que contiene.</p>

        <div class="mb-3">
            <label class="form-label">URL de la imagen</label>
            <input
                type="text"
                id="imageUrl"
                class="form-control"
                placeholder="https://ejemplo.com/imagen.jpg"
                oninput="previsualizarImagen(this.value)"
            >
        </div>

        <!-- Vista previa -->
        <div id="preview" class="mb-3 d-none">
            <img id="imgPreview" src="" alt="Vista previa"
                class="img-fluid rounded border"
                style="max-height: 250px; width: 100%; object-fit: contain;"
                onerror="document.getElementById('preview').classList.add('d-none')"
            >
        </div>

        <button id="btnDetectar" class="btn btn-secondary w-100" onclick="detectarObjetos()">
            Detectar objetos
        </button>

        <!-- Resultado -->
        <div id="resultado" class="mt-4 d-none">
            <hr>
            <p class="text-muted mb-2">Total de objetos detectados: <strong id="totalObjetos"></strong></p>
            <div id="listaObjetos"></div>
        </div>

        <!-- Error -->
        <div id="error" class="alert alert-danger mt-4 d-none"></div>

        <!-- Loading -->
        <div id="loading" class="text-center mt-4 d-none">
            <div class="spinner-border text-secondary" role="status"></div>
            <p class="mt-2 text-muted">Analizando imagen...</p>
        </div>

    </div>

    <script src="/Js/deteccion.js"></script>

</body>
</html>
